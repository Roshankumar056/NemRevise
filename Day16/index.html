<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #sendMessageDiv{
        display: none;
      }
    </style>
  </head>
  <body>
    <h3 id="userName" ></h3>
    <div id="registerDiv">
      <input
        type="text"
        id="registerName"
        placeholder="Enter Name To Register"
      />
      <button id="registerBtn">Register</button>
    </div>
    <div id="sendMessageDiv">
      <input id="message" type="text" placeholder="Enter Your Message..." >
      <button id="sendMessage">Send Message</button>
      <div id="chatHistory">

      </div>
    </div>
  </body>

  <script type="module">
    import { io } from "https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.esm.min.js";

    const socket = io("http://localhost:5000");
    let user_Name=""
    let chatHistoryDiv=document.getElementById("chatHistory");

    let registerBtn=document.getElementById("registerBtn");
    registerBtn.addEventListener("click",()=>{
        let userName=document.getElementById("registerName").value;

        console.log(userName);

        if(userName==""){
          alert("User Name Cannot Be Empty")
        }else{
          socket.emit("registerName",userName)
          user_Name=userName
          document.getElementById("userName").textContent=`Hy,${userName}`
          document.getElementById("registerDiv").style.display="none"
          document.getElementById("sendMessageDiv").style.display="block"
        }
        
        
    })

   let sendMessage=document.getElementById("sendMessage");
   sendMessage.addEventListener("click",()=>{
    let message=document.getElementById("message");
    if(message.value.trim() === ""){
      alert("Message cannot be Empty")
    }else{
      socket.emit("sendMessage",message.value);
      message.value=""
    }
   })

   socket.on("chatHistory",(chatArr)=>{
    console.log(chatArr);
    chatHistoryDiv.innerHTML="";
    chatArr.map((chat)=>{
      appendChat(chat)
    })
   })

   function appendChat(chat){
    let chatDiv=document.createElement("div")
    chatDiv.textContent=`${chat.name}:${chat.message}`
    chatHistoryDiv.appendChild(chatDiv)
   }
  </script>
</html>
